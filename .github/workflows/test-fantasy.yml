name: Fantasy calculator regression tests

on:
  push:
    paths:
      - 'scripts/fantasy/**'
      - '.github/workflows/test-fantasy.yml'
  pull_request:
    paths:
      - 'scripts/fantasy/**'
      - '.github/workflows/test-fantasy.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/fantasy/tests -v

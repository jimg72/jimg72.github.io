name: Validate card players
on:
  push:
    paths:
      - '_data/football.yaml'
      - '_data/baseball.yaml'
      - '_includes/player_card.html'
      - 'scripts/validate_card_players.py'
      - '.github/workflows/validate-card-players.yml'
  pull_request:
    paths:
      - '_data/football.yaml'
      - '_data/baseball.yaml'
      - '_includes/player_card.html'
      - 'scripts/validate_card_players.py'
      - '.github/workflows/validate-card-players.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/validate_card_players.py
